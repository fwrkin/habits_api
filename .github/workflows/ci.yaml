name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: habit_user
          POSTGRES_PASSWORD: habit_password
          POSTGRES_DB: habit_tracker_db
        ports:
          - 5432:5432
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U habit_user"]
          interval: 5s
          timeout: 5s
          retries: 5
        options: --health-cmd "pg_isready -U habit_user" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.0-alpine
        env:
          REDIS_PASSWORD: default_redis_pass
        ports:
          - 6379:6379

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set environment variables
      run: |
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
        echo "POSTGRES_DB=habit_tracker_db" >> $GITHUB_ENV
        echo "POSTGRES_USER=habit_user" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=habit_password" >> $GITHUB_ENV
        echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
        echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
        echo "REDIS_URL=redis://:default_redis_pass@localhost:6379/0" >> $GITHUB_ENV

    - name: Debug environment
      run: |
        echo "SECRET_KEY: $SECRET_KEY"
        echo "DEBUG: $DEBUG"
        echo "ALLOWED_HOSTS: $ALLOWED_HOSTS"
        echo "POSTGRES_DB: $POSTGRES_DB"
        echo "POSTGRES_USER: $POSTGRES_USER"
        echo "POSTGRES_PASSWORD: $POSTGRES_PASSWORD"
        echo "POSTGRES_HOST: $POSTGRES_HOST"
        echo "POSTGRES_PORT: $POSTGRES_PORT"
        echo "REDIS_URL: $REDIS_URL"

    - name: Run migrations
      run: |
        python manage.py makemigrations --noinput
        python manage.py migrate --noinput

    - name: Run tests
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: ${{ env.DEBUG }}
        ALLOWED_HOSTS: ${{ env.ALLOWED_HOSTS }}
        POSTGRES_DB: ${{ env.POSTGRES_DB }}
        POSTGRES_USER: ${{ env.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
        POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
        REDIS_URL: ${{ env.REDIS_URL }}
      run: |
        python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Generate SECRET_KEY
      run: |
        echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> $GITHUB_ENV
